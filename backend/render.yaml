services:
  - type: web
    name: shoe-factory-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: data/shop.db
      # Set these in the Render dashboard (Environment). Do not commit real secrets.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PUBLIC_SHOP_URL
        value: https://shoefactory-shop.web.app
