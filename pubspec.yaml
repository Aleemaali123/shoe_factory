name: shoe_factory
description: Shoe Factory ecommerce app for browsing, cart, checkout and orders.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.1.2
  http: ^1.5.0
  provider: ^6.1.5
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/shoe_factory_logo.png
